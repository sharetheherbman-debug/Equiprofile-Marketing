name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate package.json
        run: npm run preflight

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  lint:
    name: Changed Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject whitespace errors introduced by this change
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE_SHA="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "Checking changed code between $BASE_SHA and $GITHUB_SHA"
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Explain legacy formatting baseline
        run: |
          echo "The historical repository is not globally Prettier-clean."
          echo "This gate rejects new whitespace errors without rewriting hundreds of unrelated files."

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          db-repository: "ghcr.io/aquasecurity/trivy-db"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  deploy:
    name: Deploy to Production
    needs: [test, lint, ui-smoke-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

    # Production deployment remains intentionally disabled until explicit release approval.

  ui-smoke-test:
    name: UI Smoke Test
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Playwright browsers and package
        run: |
          npx playwright install chromium --with-deps
          npm install --no-save playwright

      - name: Start server and run UI smoke test
        run: |
          node dist/index.js &
          SERVER_PID=$!

          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          BASE_URL=http://localhost:3000 node scripts/ui-smoke-test.mjs
          EXIT_CODE=$?

          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE
        env:
          NODE_ENV: production
          JWT_SECRET: smoke-test-secret-min-32-chars-here
          ADMIN_UNLOCK_PASSWORD: Smoke!CI#Test99
          DATABASE_URL: mysql://smoke:smoke@127.0.0.1:3306/smoke_db
