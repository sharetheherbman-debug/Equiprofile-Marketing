name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, phase-1/small-medium-completion]
  pull_request:
    branches: [main, develop, phase-1/small-medium-completion]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: commerce-test-root
          MARIADB_DATABASE: commerce_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      COMMERCE_TEST_DATABASE_URL: mysql://root:commerce-test-root@127.0.0.1:3306/commerce_test

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate package.json
        run: npm run preflight

      - name: Type check
        run: npm run check

      - name: Audit Academy factual publication gate
        run: npm run academy:factual:audit

      - name: Provision and verify fresh final-Core schema
        env:
          DATABASE_URL: mysql://root:commerce-test-root@127.0.0.1:3306/commerce_test
          JWT_SECRET: ci-migration-process-only-secret
          ADMIN_UNLOCK_PASSWORD: CI-Migration-Process-Only
        run: |
          npm run db:provision-fresh
          npx tsx scripts/audit-migration-baseline.ts > migration-inspection.json
          node --input-type=module -e 'import fs from "node:fs"; const report=JSON.parse(fs.readFileSync("migration-inspection.json","utf8")); if(report.classification!=="CURRENT_NO_ACTION_REQUIRED") throw new Error(`Unexpected migration classification: ${report.classification}`); const differences=Object.values(report.differences).flat(); if(differences.length) throw new Error(`Schema differences remain: ${differences.join(", ")}`); console.log(`Migration gate: ${report.classification}; ${report.observed.tableCount} tables; zero differences`);'

      - name: Run tests in deterministic single-fork mode
        run: npx vitest run --pool=forks --no-file-parallelism --maxWorkers=1

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  lint:
    name: Changed Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject whitespace errors introduced by this change
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE_SHA="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "Checking changed code between $BASE_SHA and $GITHUB_SHA"
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Explain legacy formatting baseline
        run: |
          echo "The historical repository is not globally Prettier-clean."
          echo "This gate rejects new whitespace errors without rewriting hundreds of unrelated files."

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "npm"

      - name: Reject high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  deploy:
    name: Deploy to Production
    needs: [test, lint, security, ui-smoke-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

    # Production deployment remains intentionally disabled until explicit release approval.

  ui-smoke-test:
    name: UI Smoke Test
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Playwright browsers and package
        run: npx playwright install chromium --with-deps

      - name: Start server and run UI smoke test
        run: |
          node dist/index.js &
          SERVER_PID=$!

          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          BASE_URL=http://localhost:3000 node scripts/ui-smoke-test.mjs
          EXIT_CODE=$?

          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE
        env:
          NODE_ENV: production
          JWT_SECRET: smoke-test-secret-min-32-chars-here
          ADMIN_UNLOCK_PASSWORD: Smoke!CI#Test99
          DATABASE_URL: mysql://smoke:smoke@127.0.0.1:3306/smoke_db

      - name: Run authenticated Management browser acceptance
        run: npm run acceptance:management
        env:
          NODE_ENV: test
